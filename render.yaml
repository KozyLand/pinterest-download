services:
  - type: web
    name: pinterest-download
    runtime: node
    plan: free
    buildCommand: npm install && npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: PINTEREST_APP_ID
        sync: false
      - key: PINTEREST_APP_SECRET
        sync: false
      - key: PINTEREST_REDIRECT_URI
        value: https://pinterest-download.onrender.com/auth/pinterest/callback
      - key: WEB_ORIGIN
        value: https://pinterest-download.onrender.com
      - key: SESSION_SECRET
        generateValue: true
